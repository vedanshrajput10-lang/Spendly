<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Spendly{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <!-- PWA: makes Spendly installable on phones -->
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#22304A">

  <!-- iOS-specific "Add to Home Screen" support -->
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spendly">

  <!-- Android/Chrome icon -->
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icon-192.png') }}">

  <!-- Apply saved dark-mode preference immediately, before the page paints,
       so there's no flash of the wrong theme on load. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem("spendly-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  {% block body %}{% endblock %}

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("{{ url_for('static', filename='service-worker.js') }}")
          .catch(() => {
            // Silently ignore — app still works fine without the service worker.
          });
      });
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle("dark");
      try {
        localStorage.setItem("spendly-theme", isDark ? "dark" : "light");
      } catch (e) {}
    }
  </script>
</body>
</html>
